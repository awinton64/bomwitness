[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bomwitness"
version = "0.2.0"
description = "Verify declared IoT bills of materials against firmware bytes, without trusting the device's own package database."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyelftools>=0.31", "cryptography>=42", "PySquashfsImage>=0.9"]

[project.scripts]
bomwitness = "bomwitness.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["bomwitness"]
